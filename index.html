<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Presença Escolar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1d3557;
        }

        button {
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
        }

        form label,
        form input {
            display: block;
            margin: 6px auto;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #ffffff;
        }
    </style>
</head>

<body>

    <h1>Sistema de Presença Escolar</h1>

    <p>Bem-vindo ao sistema de controle de presença.</p>

    <button onclick="mostrarCadastro()">Cadastrar Aluno</button>
    <button onclick="mostrarAlunos()">Alunos Cadastrados</button>
    <button onclick="mostrarPresencas()">Registrar Presenças</button>

    <div id="cadastro" style="display: none;">
        <h2>Cadastrar Aluno</h2>
        <form onsubmit="salvarAluno(event)">
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" required>

            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" required>

            <label for="turma">Turma:</label>
            <input type="text" id="turma" required>

            <button type="submit">Salvar Aluno</button>
        </form>
        <p id="mensagem"></p>
    </div>

    <div id="listaAlunos" style="display: none;">
        <h2>Alunos Cadastrados</h2>
        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Nº da matrícula</th>
                    <th>Turma</th>
                    <th>QR Code</th>
                </tr>
            </thead>
            <tbody id="alunos"></tbody>
        </table>
    </div>

    <div id="areaPresencas" style="display: none;">
        <h2>Registro de Presença</h2>

        <label for="matriculaPresenca">Número da matrícula:</label>
        <input type="text" id="matriculaPresenca" placeholder="Digite a matrícula do aluno">

        <button onclick="registrarPresenca()">Confirmar Presença</button>

        <p id="mensagemPresenca"></p>

        <h3>Presenças Registradas</h3>
        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Matrícula</th>
                    <th>Turma</th>
                    <th>Data</th>
                    <th>Horário</th>
                </tr>
            </thead>
            <tbody id="listaPresencas"></tbody>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // ---------- Funções que leem/gravam os dados ----------
        // Hoje os dados ficam no localStorage (no navegador).
        // Se um dia trocar para um banco de dados, só estas 4 funções mudam.

        function lerAlunos() {
            return JSON.parse(localStorage.getItem("alunos")) || [];
        }

        function gravarAlunos(alunos) {
            localStorage.setItem("alunos", JSON.stringify(alunos));
        }

        function lerPresencas() {
            return JSON.parse(localStorage.getItem("presencas")) || [];
        }

        function gravarPresencas(presencas) {
            localStorage.setItem("presencas", JSON.stringify(presencas));
        }

        // ---------- Navegação entre telas ----------

        function mostrarCadastro() {
            document.getElementById("cadastro").style.display = "block";
            document.getElementById("listaAlunos").style.display = "block"; // lista aparece junto
            document.getElementById("areaPresencas").style.display = "none";

            atualizarListaAlunos();
        }

        function mostrarAlunos() {
            document.getElementById("listaAlunos").style.display = "block";
            document.getElementById("cadastro").style.display = "none";
            document.getElementById("areaPresencas").style.display = "none";

            atualizarListaAlunos();
        }

        function mostrarPresencas() {
            document.getElementById("areaPresencas").style.display = "block";
            document.getElementById("listaAlunos").style.display = "none";
            document.getElementById("cadastro").style.display = "none";

            mostrarListaPresencas();
        }

        // ---------- Alunos ----------

        function salvarAluno(event) {
            event.preventDefault();

            let nome = document.getElementById("nome").value.trim();
            let matricula = document.getElementById("matricula").value.trim();
            let turma = document.getElementById("turma").value.trim();

            let alunos = lerAlunos();

            if (alunos.some(aluno => aluno.matricula === matricula)) {
                document.getElementById("mensagem").innerText =
                    "Essa matrícula já está cadastrada!";
                return;
            }

            alunos.push({ nome: nome, matricula: matricula, turma: turma });
            gravarAlunos(alunos);

            document.getElementById("mensagem").innerText =
                "Aluno " + nome + " salvo com sucesso!";

            event.target.reset();

            atualizarListaAlunos(); // a tabela cresce a cada aluno salvo
        }

        function atualizarListaAlunos() {
            let alunos = lerAlunos();
            let conteudo = document.getElementById("alunos");

            conteudo.innerHTML = "";

            if (alunos.length === 0) {
                let linha = document.createElement("tr");
                let celula = document.createElement("td");
                celula.colSpan = 4;
                celula.textContent = "Nenhum aluno cadastrado.";
                linha.appendChild(celula);
                conteudo.appendChild(linha);
                return;
            }

            alunos.forEach(function (aluno) {
                let linha = document.createElement("tr");

                [aluno.nome, aluno.matricula, aluno.turma].forEach(function (valor) {
                    let celula = document.createElement("td");
                    celula.textContent = valor;
                    linha.appendChild(celula);
                });

                let colunaQR = document.createElement("td");
                let botao = document.createElement("button");
                botao.textContent = "Gerar QR Code";
                let areaQR = document.createElement("div");

                botao.onclick = function () {
                    areaQR.innerHTML = "";
                    if (typeof QRCode === "undefined") {
                        areaQR.textContent = "Biblioteca QR Code não carregada.";
                        return;
                    }
                    new QRCode(areaQR, {
                        text: "PRESENCA:" + aluno.matricula,
                        width: 150,
                        height: 150
                    });
                };

                colunaQR.appendChild(botao);
                colunaQR.appendChild(areaQR);
                linha.appendChild(colunaQR);

                conteudo.appendChild(linha);
            });
        }

        // ---------- Presenças ----------

        function registrarPresenca() {
            let matricula = document.getElementById("matriculaPresenca").value.trim();
            let mensagem = document.getElementById("mensagemPresenca");

            if (matricula === "") {
                mensagem.textContent = "Digite a matrícula do aluno.";
                return;
            }

            let aluno = lerAlunos().find(a => a.matricula === matricula);

            if (!aluno) {
                mensagem.textContent = "Aluno não encontrado.";
                return;
            }

            let presencas = lerPresencas();
            let agora = new Date();
            let hoje = agora.toLocaleDateString("pt-BR");

            let jaRegistrou = presencas.some(
                p => p.matricula === aluno.matricula && p.data === hoje
            );

            if (jaRegistrou) {
                mensagem.textContent = aluno.nome + " já teve presença registrada hoje.";
                return;
            }

            presencas.push({
                nome: aluno.nome,
                matricula: aluno.matricula,
                turma: aluno.turma,
                data: hoje,
                horario: agora.toLocaleTimeString("pt-BR")
            });

            gravarPresencas(presencas);

            mensagem.textContent = "Presença registrada para " + aluno.nome + "!";
            document.getElementById("matriculaPresenca").value = "";

            mostrarListaPresencas();
        }

        function mostrarListaPresencas() {
            let presencas = lerPresencas();
            let lista = document.getElementById("listaPresencas");

            lista.innerHTML = "";

            presencas.forEach(function (presenca) {
                let linha = document.createElement("tr");

                [presenca.nome, presenca.matricula, presenca.turma, presenca.data, presenca.horario]
                    .forEach(function (valor) {
                        let celula = document.createElement("td");
                        celula.textContent = valor;
                        linha.appendChild(celula);
                    });

                lista.appendChild(linha);
            });
        }
    </script>

</body>

</html>
